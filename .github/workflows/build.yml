name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Build frontend
        run: bun run build

      # The `custom-protocol` feature is REQUIRED: tauri's build.rs sets
      # `dev = !custom-protocol`, so without it the release exe loads the dev URL
      # (http://localhost:1420) and end users get ERR_CONNECTION_REFUSED. With it,
      # the build embeds and serves ../dist.
      - name: Build release exe (embedded frontend)
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/desjanjador.exe
            Install.bat
            Uninstall.bat
            README.md
          fail_on_unmatched_files: true

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: desjanjador-exe
          path: src-tauri/target/release/desjanjador.exe
