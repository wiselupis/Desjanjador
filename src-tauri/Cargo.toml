[package]
name = "desjanjador"
version = "0.1.0"
description = "Desjanjador — network privacy patches"
authors = ["WiseLupis"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows quirk).
name = "desjanjador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
reqwest = { version = "0.12", features = ["json", "socks"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }
