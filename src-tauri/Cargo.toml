[package]
name = "desjanjador"
version = "0.1.16"
description = "Desjanjador — network privacy patches"
authors = ["WiseLupis"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows quirk).
name = "desjanjador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# REQUIRED for production: enables Tauri's custom protocol so the release app
# serves the EMBEDDED frontend. Without it, `dev = !custom-protocol` is true and
# the app loads devUrl (http://localhost:1420) even in release -> blank/ERR page.
# Build release with `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
reqwest = { version = "0.12", features = ["json", "socks"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
